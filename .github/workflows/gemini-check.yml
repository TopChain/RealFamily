name: Verify Gemini cloud connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Verify key without generating paid content
        run: |
          python - <<'PY'
          import os,json,urllib.request
          key=os.environ.get('GEMINI_API_KEY')
          if not key:raise SystemExit('GEMINI_API_KEY has not been configured.')
          models=[];page=None
          try:
              while True:
                  from urllib.parse import urlencode
                  url='https://generativelanguage.googleapis.com/v1beta/models'
                  if page:url+='?'+urlencode({'pageToken':page})
                  req=urllib.request.Request(url,headers={'x-goog-api-key':key})
                  with urllib.request.urlopen(req,timeout=25) as r:data=json.load(r)
                  models.extend(m['name'] for m in data.get('models',[]) if 'generateContent' in m.get('supportedGenerationMethods',[]))
                  page=data.get('nextPageToken')
                  if not page:break
          except Exception:
              raise SystemExit('Gemini connection could not be verified. Check key restrictions and API access; no content was generated.') from None
          print('Gemini cloud authentication verified. No content was generated.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'w') as f:
              f.write('## Gemini connection verified\n\nNo text or image generation was requested.\n\n')
              for m in sorted(models):f.write('- `'+m+'`\n')
          PY
