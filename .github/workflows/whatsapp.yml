name: Daily WhatsApp family cards
on:
  schedule:
    # Both offsets; the program checks the PT date and 7:30 AM threshold.
    - cron: '30 14,15 * * *'
    - cron: '45 16 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-family-whatsapp
  cancel-in-progress: false
jobs:
  cards:
    if: vars.WHATSAPP_CLOUD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WHATSAPP_STATE_KEY: ${{ secrets.WHATSAPP_STATE_KEY }}
      MAILER_SECRET: ${{ secrets.MAILER_SECRET }}
      SUBSCRIPTION_ENDPOINT: https://real-family-subscriptions.vercel.app/api/subscription
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/whatsapp/package-lock.json
      - run: npm ci --prefix scripts/whatsapp --ignore-scripts
      - run: node scripts/whatsapp/relay.mjs
