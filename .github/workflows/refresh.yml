name: Pacific three-hour feeds and daily editions
on:
  schedule:
    - cron: '7 * * * *'
    - cron: '0 7,8 * * *'
    - cron: '23 7,8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: real-family-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh.py
      - name: Save verified data
        run: |
          git config user.name 'Real Family updater'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/research-archive.json data/english-history.json data/english-archive data/english-staged data/daily-history.json data/health-archive data/recipes-archive
          git diff --cached --quiet || git commit -m 'Refresh verified public sources'
          git push
